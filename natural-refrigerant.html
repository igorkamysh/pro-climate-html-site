<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Природные хладагенты | PRO Климат</title>
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="hero">
        <div class="container">
            <div class="breadcrumbs"><a href="/">Главная</a> <span>/</span> Эко-холод</div>
            <h1>Природные хладагенты</h1>
            <p class="lead">CO₂ и Аммиак. Эффективность без экологических рисков.</p>
        </div>
    </section>

    <div class="container page-layout">
        <aside class="sidebar">
            <div class="side-title">Навигация</div>
            <nav class="side-nav">
                <a href="#why" class="active">Сравнение</a>
                <a href="#co2">CO₂</a>
                <a href="#nh3">Аммиак</a>
            </nav>
        </aside>
        <main class="content">
            <section id="why">
                <h2>Сравнение GWP (Global Warming Potential)</h2>
                <div class="card">
                    <div class="gwp-row">
                        <div class="gwp-meta"><span>R404A (Фреон)</span><span>3922</span></div>
                        <div class="gwp-track"><div class="gwp-fill" data-width="100%" style="width:0;"></div></div>
                    </div>
                    <div class="gwp-row">
                        <div class="gwp-meta"><span>R410A (Фреон)</span><span>2088</span></div>
                        <div class="gwp-track"><div class="gwp-fill" data-width="53%" style="width:0;"></div></div>
                    </div>
                    <div class="gwp-row">
                        <div class="gwp-meta"><span>CO₂ (R744)</span><span>1</span></div>
                        <div class="gwp-track"><div class="gwp-fill eco" data-width="1%" style="width:0;"></div></div>
                    </div>
                </div>
            </section>
            
            <section id="co2">
                <h2>CO₂ (R744)</h2>
                <p>Негорючий, нетоксичный. Идеален для ритейла и складов.</p>
            </section>
        </main>
    </div>

    <div id="cta-placeholder"></div>
    <div id="footer-placeholder"></div>
    <script src="assets/js/site.js"></script>
</body>
</html>
