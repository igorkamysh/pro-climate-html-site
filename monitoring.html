<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-мониторинг HVAC — PRO Климат</title>
    <meta name="description" content="Дистанционный контроль параметров и предиктивная диагностика.">
    <link rel="canonical" href="https://pro.master52.ru/monitoring.html">
    <meta property="og:title" content="AI-мониторинг HVAC — PRO Климат">
    <meta property="og:description" content="Дистанционный контроль параметров и предиктивная диагностика.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://pro.master52.ru/monitoring.html">
    <meta property="og:site_name" content="PRO Климат">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AI-мониторинг HVAC — PRO Климат">
    <meta name="twitter:description" content="Дистанционный контроль параметров и предиктивная диагностика.">
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <div id="header-inj"></div>
    <main>
        <div class="container content-from-info" data-info="monitoring"></div>
        <section class="card" aria-labelledby="chart-title" style="margin:40px auto; max-width:960px;">
            <div class="grid-2" data-chart>
                <div>
                    <h2 id="chart-title">Сравнение владения хладагентом</h2>
                    <p class="subhead">Настройте горизонты и допущения: расчёт только для оценки.</p>
                    <label for="horizon">Горизонт, лет</label>
                    <select id="horizon">
                        <option value="5">5 лет</option>
                        <option value="10">10 лет</option>
                    </select>
                    <label for="leak">Утечки, % в год</label>
                    <input type="number" id="leak" data-leak min="0" max="25" step="0.5" value="5">
                    <label for="price">Стоимость энергии, ₽/кВт·ч</label>
                    <input type="number" id="price" data-price min="1" step="0.1" value="6">
                </div>
                <div style="align-self:center;">
                    <canvas width="420" height="260" aria-label="Диаграмма TCO" role="img"></canvas>
                </div>
            </div>
        </section>
    </main>
    <div id="cta-inj"></div>
    <div id="footer-inj"></div>
    <script src="assets/js/site.js" defer></script>
</body>
</html>
